databases:
  - name: stocksense-db
    plan: free
    region: ohio

services:
  - type: redis
    name: stocksense-redis
    plan: free
    region: ohio
    maxmemoryPolicy: noeviction

  - type: web
    name: stocksense-web
    env: python
    plan: free
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: stocksense-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: worker
    name: stocksense-celery
    env: python
    plan: free
    region: ohio
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A backend.celery_app worker -l info -B"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: stocksense-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: stocksense-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
